{% extends 'base.html' %}

{% block title %}Novo Carro - PycodeBR{% endblock %}

{% block content %}
<style>
    .container-central {
        display: flex;
        justify-content: center;
        /* Centraliza horizontalmente */
        align-items: center;
        /* Centraliza verticalmente */
        min-height: 80vh;
        /* Usa a altura da viewport respeitando o header/footer */
        background-color: #f4f4f4;
        padding: 20px;
    }

    /* Estiliza o formulário */
    .meu-formulario {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        /* Aumentado um pouco para caber melhor os campos */
    }

    .meu-formulario h4 {
        margin-top: 0;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
    }

    fieldset {
        border: none;
        padding: 0;
        margin: 0;
    }

    table {
        width: 100%;
        margin-bottom: 20px;
    }

    /* Estilização básica das linhas da tabela do formulário */
    table td {
        padding: 8px 4px;
        vertical-align: middle;
    }

    table label {
        font-weight: bold;
        color: #555;
    }

    /* Estilização dos inputs gerados pelo Django dentro da tabela */
    table input,
    table select {
        width: 100%;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .grupo-botoes {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .btn {
        text-decoration: none;
        display: inline-block;
        padding: 10px 20px;
        border-radius: 4px;
        text-align: center;
        font-size: 14px;
        cursor: pointer;
        border: none;
        width: 48%;
        /* Divide o espaço entre os dois botões */
    }

    /* Cor de destaque para o botão de envio */
    .btn-salvar {
        background-color: #0096c7;
        /* Combinando com a cor do seu header */
        color: white;
    }

    /* Cor neutra para o botão de fechar */
    .btn-fechar {
        background-color: #6c757d;
        color: white;
    }

    /* Efeito de hover */
    .btn-salvar:hover {
        background-color: #108eb8;
    }

    .btn-fechar:hover {
        background-color: #5a6268;
    }

    /* Estilização para as mensagens de erro do formulário */
    .errorlist {
        color: #dc3545;
        list-style: none;
        padding: 0;
        margin: 5px 0;
        font-size: 12px;
    }
</style>

<div class="container-central">
    <!-- enctype obrigatório por conta do campo 'photo' de upload de imagem -->
    <form class="meu-formulario" method="POST" enctype="multipart/form-data">
        <h4><strong>PyCodeBr - Cadastro de Carro</strong></h4>

        <fieldset>
            
            {% csrf_token %}           
            <table>
               {{ form.as_table }}
            </table>

            <div class="grupo-botoes">
                <button type="submit" class="btn btn-salvar">Incluir</button>
                <a href="{% url 'cars_list' %}" class="btn btn-fechar">Fechar</a>
            </div>
        </fieldset>
    </form>
</div>
{% endblock %}
