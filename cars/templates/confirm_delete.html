{% extends 'base.html' %}
{% block content %}

<div class="container-central" style="padding: 20px; text-align: center;">
    <form method="POST" class="meu-formulario" style="max-width: 500px; margin: 0 auto;">
        {% csrf_token %}
        <h3>Tem certeza que deseja excluir o perfil?</h3>
        <p style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px;">
            <strong>{{ perfil.perfil_cliente }}</strong> - {{ perfil.descricao }}
        </p>
        <p>Esta ação não poderá ser desfeita!</p>
        <br>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button type="submit" class="btn" style="background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Sim, Excluir</button>
            <a href="{% url 'list_perfil_cliente' %}" class="btn" style="background-color: #6c757d; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none;">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
